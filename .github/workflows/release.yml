name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

permissions:
  contents: write

# Every job's toolchain, components included, is rust-toolchain.toml's (`rustup toolchain
# install` with no name reads it). Every job has a time limit of about twice its longest recent
# run, so a hung test fails its job rather than holding a runner for GitHub's six hours.
jobs:
  # A tag must name the version the files give: binaries report Cargo.toml's version, and a
  # package published under another would be offered by the updater again and again. Checked
  # before anything is built; `cargo xtask bump <version>` writes the files.
  version:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: The tag matches Cargo.toml, the documentation and the changelog
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 packaging/release-version.py check "${GITHUB_REF_NAME#v}"

  # The tests on the tagged commit. The packages build alongside, but are published only if
  # these pass.
  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  macos:
    needs: version
    timeout-minutes: 90
    runs-on: macos-15
    env:
      # Signing and notarisation need the Developer ID secrets; without them the app is signed
      # ad hoc, as before.
      SIGNED: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - run: rustup toolchain install
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build both architectures
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --target "$target" -p adocfoundry -p adocfoundry-cli -p adoc-ls -p adoc-mcp --features adoc-ls/typst,adoc-ls/git
          done
      - name: Universal binaries
        run: |
          mkdir -p dist
          for bin in adocfoundry adocfoundry-cli adoc-ls adoc-mcp; do
            lipo -create -output "dist/$bin" \
              "target/aarch64-apple-darwin/release/$bin" "target/x86_64-apple-darwin/release/$bin"
          done
      # The third-party notices every package ships, as Help › About shows them.
      - run: cargo xtask notices target/THIRD-PARTY-NOTICES.txt
      - name: Import the Developer ID certificate
        if: env.SIGNED == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -f pkcs12 \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          # Apple's Developer ID G2 intermediate, which issued the certificate: without it
          # codesign cannot build the chain to Apple's root and fails with
          # errSecInternalComponent. Checked against its known digest before it is trusted.
          # On the macOS 15 image it is already there (the import fails with "The specified item
          # already exists in the keychain"), so it is imported only when no keychain that
          # codesign reads holds it: the new one, the user's search list or the system's.
          intermediate_sha256="F16CD3C54C7F83CEA4BF1A3E6A0819C8AAA8E4A1528FD144715F350643D2DF3A"
          if security find-certificate -a -Z "$keychain" $(security list-keychains -d user | tr -d '"') \
              /Library/Keychains/System.keychain | grep -qx "SHA-256 hash: $intermediate_sha256"; then
            echo "A keychain already holds the Developer ID G2 intermediate."
          else
            intermediate="$RUNNER_TEMP/DeveloperIDG2CA.cer"
            curl -fsSL -o "$intermediate" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
            echo "$intermediate_sha256  $intermediate" | shasum -a 256 -c -
            security import "$intermediate" -k "$keychain"
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
      # The identity only when its certificate was imported: bundle.sh signs with whatever
      # identity it is given, and an identity without its certificate fails the build.
      - name: App bundle and DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_ID || '' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_APP_PASSWORD || '' }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          packaging/macos/bundle.sh dist/adocfoundry "$version" dist \
            dist/adocfoundry-cli dist/adoc-ls dist/adoc-mcp
          # The archives carry the signed tools from the bundle, the dictionaries' licence and the
          # third-party notices.
          notices="$RUNNER_TEMP/notices"
          mkdir -p "$notices/licenses"
          cp crates/adoc-spell/dictionaries/README.md "$notices/licenses/SCOWL.txt"
          cp target/THIRD-PARTY-NOTICES.txt "$notices/licenses/"
          for bin in adoc-ls adocfoundry-cli adoc-mcp; do
            cp "dist/AdocFoundry.app/Contents/MacOS/$bin" "dist/$bin"
            tar -czf "dist/$bin-$version-macos-universal.tar.gz" -C dist "$bin" \
              -C "$notices" licenses/SCOWL.txt licenses/THIRD-PARTY-NOTICES.txt
          done
      - name: Check the signatures
        if: env.SIGNED == 'true'
        run: |
          codesign --verify --strict --deep --verbose=2 dist/AdocFoundry.app
          spctl --assess --type execute -vv dist/AdocFoundry.app
          xcrun stapler validate dist/AdocFoundry.app
          xcrun stapler validate dist/*.dmg
          spctl --assess --type open --context context:primary-signature -vv dist/*.dmg
          echo "macOS: signed with a Developer ID, notarised and stapled" >> "$GITHUB_STEP_SUMMARY"
      - name: Unsigned
        if: env.SIGNED != 'true'
        run: |
          echo "macOS: signed ad hoc; no Developer ID secrets" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the signing keychain
        if: always() && env.SIGNED == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos
          path: |
            dist/*.dmg
            dist/*.tar.gz

  windows:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    timeout-minutes: 60
    runs-on: windows-latest
    env:
      # Authenticode through Azure Artifact Signing; without its secrets nothing is signed.
      SIGNED: ${{ secrets.AZURE_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - run: rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      # Released binaries at pinned versions, not builds from source of whatever is newest.
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-wix@0.3.9
      - run: cargo build --release --target ${{ matrix.target }} -p adocfoundry -p adocfoundry-cli -p adoc-ls -p adoc-mcp --features adoc-ls/typst,adoc-ls/git
      # The third-party notices, for the MSI and the zips.
      - run: cargo xtask notices target/THIRD-PARTY-NOTICES.txt
      # The executables are signed before the MSI and the zips take them.
      - name: Sign the executables
        if: env.SIGNED == 'true'
        # Pinned to a commit: the action handles the signing credentials.
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\target\${{ matrix.target }}\release\adocfoundry.exe
            ${{ github.workspace }}\target\${{ matrix.target }}\release\adocfoundry-cli.exe
            ${{ github.workspace }}\target\${{ matrix.target }}\release\adoc-ls.exe
            ${{ github.workspace }}\target\${{ matrix.target }}\release\adoc-mcp.exe
          file-digest: SHA256
          timestamp-digest: SHA256
      - name: MSI
        run: cargo wix -p adocfoundry --no-build --nocapture --target ${{ matrix.target }} --output dist/
      - name: Sign the MSI
        if: env.SIGNED == 'true'
        # Pinned to a commit: the action handles the signing credentials.
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-digest: SHA256
      - name: Check the signatures
        if: env.SIGNED == 'true'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist/*.msi) + @(Get-ChildItem "target/${{ matrix.target }}/release/*.exe" | Where-Object { $_.BaseName -in "adocfoundry","adocfoundry-cli","adoc-ls","adoc-mcp" })
          foreach ($file in $files) {
            $status = (Get-AuthenticodeSignature -LiteralPath $file.FullName).Status
            if ($status -ne "Valid") { throw "$($file.Name): $status" }
          }
          "Windows ${{ matrix.arch }}: executables and MSI signed with Authenticode" >> $env:GITHUB_STEP_SUMMARY
      - name: Unsigned
        if: env.SIGNED != 'true'
        shell: pwsh
        run: |
          "Windows ${{ matrix.arch }}: unsigned; no Azure Artifact Signing secrets" >> $env:GITHUB_STEP_SUMMARY
      - name: Portable zip
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $bin = "target/${{ matrix.target }}/release"
          # The dictionaries' licence and the third-party notices, as licenses/SCOWL.txt and
          # licenses/THIRD-PARTY-NOTICES.txt in each zip.
          $licenses = Join-Path $env:RUNNER_TEMP "notices/licenses"
          New-Item -ItemType Directory -Force -Path $licenses | Out-Null
          Copy-Item crates/adoc-spell/dictionaries/README.md (Join-Path $licenses "SCOWL.txt")
          Copy-Item target/THIRD-PARTY-NOTICES.txt $licenses
          Compress-Archive -Path "$bin/adocfoundry.exe","$bin/adocfoundry-cli.exe","$bin/adoc-ls.exe","$bin/adoc-mcp.exe",LICENSE,README.md,$licenses `
            -DestinationPath "dist/AdocFoundry-$version-windows-${{ matrix.arch }}.zip"
          Compress-Archive -Path "$bin/adoc-ls.exe",$licenses -DestinationPath "dist/adoc-ls-$version-windows-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-${{ matrix.arch }}
          path: |
            dist/*.msi
            dist/*.zip

  linux:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    timeout-minutes: 60
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - run: rustup toolchain install
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libfontconfig-dev libxcb1-dev libx11-xcb-dev libssl-dev file
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-deb@3.8.0,cargo-generate-rpm@0.21.1
      - run: cargo build --release -p adocfoundry -p adocfoundry-cli -p adoc-ls -p adoc-mcp --features adoc-ls/typst,adoc-ls/git
      # The third-party notices, which the deb and rpm take from here.
      - run: cargo xtask notices target/THIRD-PARTY-NOTICES.txt
      - name: deb and rpm
        run: |
          mkdir -p dist
          cargo deb -p adocfoundry --no-build --output dist/
          cargo generate-rpm -p crates/adocfoundry --output dist/
      - name: AppImage
        run: |
          version="${GITHUB_REF_NAME#v}"
          # A tagged linuxdeploy, checked against its hash before it runs and packs the AppImage.
          curl -fsSL -o linuxdeploy "https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-${{ matrix.arch }}.AppImage"
          case "${{ matrix.arch }}" in
            x86_64) sum=c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d ;;
            aarch64) sum=620095110d693282b8ebeb244a95b5e911cf8f65f76c88b4b47d16ae6346fcff ;;
          esac
          echo "$sum  linuxdeploy" | sha256sum -c
          chmod +x linuxdeploy
          cp packaging/icons/adocfoundry-256.png io.github.bovinemagnet.AdocFoundry.png
          # linuxdeploy keeps what the AppDir holds already: the dictionaries' licence and the
          # third-party notices, as the deb has them.
          install -Dm644 crates/adoc-spell/dictionaries/README.md AppDir/usr/share/doc/adocfoundry/SCOWL.txt
          install -Dm644 target/THIRD-PARTY-NOTICES.txt -t AppDir/usr/share/doc/adocfoundry
          # Update information for AppImageUpdate, and the .zsync it reads, published with the
          # release.
          update="gh-releases-zsync|bovinemagnet|AdocFoundry|latest|AdocFoundry-*-${{ matrix.arch }}.AppImage.zsync"
          export LDAI_UPDATE_INFORMATION="$update" UPDATE_INFORMATION="$update"
          APPIMAGE_EXTRACT_AND_RUN=1 OUTPUT="dist/AdocFoundry-$version-${{ matrix.arch }}.AppImage" ./linuxdeploy \
            --appdir AppDir \
            --executable target/release/adocfoundry \
            --executable target/release/adocfoundry-cli \
            --executable target/release/adoc-ls \
            --executable target/release/adoc-mcp \
            --desktop-file packaging/linux/io.github.bovinemagnet.AdocFoundry.desktop \
            --icon-file io.github.bovinemagnet.AdocFoundry.png \
            --output appimage
          # linuxdeploy writes the .zsync beside the AppImage, or in the working directory.
          if ! ls dist/*.AppImage.zsync >/dev/null 2>&1; then mv ./*.AppImage.zsync dist/; fi
      - name: The Flatpak manifest installs what the packages carry
        run: |
          for bin in adocfoundry adocfoundry-cli adoc-ls adoc-mcp; do
            grep -q "install -Dm755 target/release/$bin -t /app/bin" packaging/flatpak/io.github.bovinemagnet.AdocFoundry.yml
          done
          grep -q -- "--features adoc-ls/typst,adoc-ls/git" packaging/flatpak/io.github.bovinemagnet.AdocFoundry.yml
          grep -q "crates/adoc-spell/dictionaries/README.md /app/share/doc/adocfoundry/SCOWL.txt" packaging/flatpak/io.github.bovinemagnet.AdocFoundry.yml
          grep -q "target/THIRD-PARTY-NOTICES.txt -t /app/share/doc/adocfoundry" packaging/flatpak/io.github.bovinemagnet.AdocFoundry.yml
      - name: Command-line tools
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Each with the dictionaries' licence and the third-party notices, staged outside dist/,
          # which is uploaded whole.
          notices="$RUNNER_TEMP/notices"
          mkdir -p "$notices/licenses"
          cp crates/adoc-spell/dictionaries/README.md "$notices/licenses/SCOWL.txt"
          cp target/THIRD-PARTY-NOTICES.txt "$notices/licenses/"
          for bin in adoc-ls adocfoundry-cli adoc-mcp; do
            tar -czf "dist/$bin-$version-linux-${{ matrix.arch }}.tar.gz" -C target/release "$bin" \
              -C "$notices" licenses/SCOWL.txt licenses/THIRD-PARTY-NOTICES.txt
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  # Each platform's artefacts, downloaded as a user would get them: every binary's --version, a
  # PDF export, the language and MCP servers' initialise and shutdown, and the app staying up.
  smoke:
    needs: [macos, windows, linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            artefact: macos
          - runner: windows-latest
            artefact: windows-x64
          - runner: ubuntu-22.04
            artefact: linux-x86_64
    timeout-minutes: 30
    runs-on: ${{ matrix.runner }}
    env:
      # Whether this platform's release job signed its binaries.
      SIGNED: ${{ (matrix.artefact == 'macos' && secrets.APPLE_CERTIFICATE != '') || (matrix.artefact == 'windows-x64' && secrets.AZURE_CLIENT_ID != '') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ matrix.artefact }}
          path: artefacts
      - name: Unpack (macOS)
        if: runner.os == 'macOS'
        run: |
          hdiutil attach artefacts/*.dmg -mountpoint /Volumes/AdocFoundry
          echo "BIN=/Volumes/AdocFoundry/AdocFoundry.app/Contents/MacOS" >> "$GITHUB_ENV"
      - name: Unpack (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive -Path (Get-ChildItem artefacts/AdocFoundry-*.zip).FullName -DestinationPath unpacked
          "BIN=$PWD/unpacked" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Unpack (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0 libwayland-client0 libvulkan1 libfontconfig1
          dpkg -x artefacts/*.deb unpacked
          echo "BIN=$PWD/unpacked/usr/bin" >> "$GITHUB_ENV"
      # A hosted Linux runner has no GPU for the app's Vulkan renderer, so the app's launch is
      # checked on macOS and Windows and by hand on Linux (docs/qa/phase5.md).
      - name: Smoke test
        shell: bash
        run: |
          signed=()
          if [[ "$SIGNED" == "true" ]]; then signed=(--expect-signed); fi
          # A tag's packages must report the tag's version.
          expected=()
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then expected=(--expect-version "${GITHUB_REF_NAME#v}"); fi
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            python3 packaging/smoke-test.py "$BIN" --no-app "${expected[@]}"
          else
            python3 packaging/smoke-test.py "$BIN" "${signed[@]}" "${expected[@]}"
          fi
      # The AppImage carries the tools as the deb does.
      - name: Smoke test (AppImage)
        if: runner.os == 'Linux'
        run: |
          chmod +x artefacts/*.AppImage
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE"/artefacts/*.AppImage --appimage-extract >/dev/null)
          expected=()
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then expected=(--expect-version "${GITHUB_REF_NAME#v}"); fi
          python3 packaging/smoke-test.py "$RUNNER_TEMP/squashfs-root/usr/bin" --no-app "${expected[@]}"

  publish:
    needs: [ci, smoke]
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The changelog's section for the version, ahead of GitHub's list of pull requests.
      - name: Release notes
        run: python3 packaging/release-version.py notes "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/release-notes.md"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artefacts
          merge-multiple: true
      # The app checks a package against this before it installs it.
      - name: Checksums
        run: (cd artefacts && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: artefacts/*
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
