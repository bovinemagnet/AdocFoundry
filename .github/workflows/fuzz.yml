name: Fuzz

# The fuzz targets in fuzz/, apart from CI so it stays quick: each runs for five minutes every
# week and when run by hand; a change to the targets only builds them, so they do not rot.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'fuzz/**'
      - '.github/workflows/fuzz.yml'
  push:
    branches: [main]
    paths:
      - 'fuzz/**'
      - '.github/workflows/fuzz.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --check
      - run: cargo +nightly fuzz build

  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target:
          - parse_source
          - parse_dom
          - model_roundtrip
          - antora_resource_id
          - math_is_safe
          - pdf_literal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: python3 fuzz/seed.py
      - name: Fuzz ${{ matrix.target }}
        run: >-
          cargo +nightly fuzz run ${{ matrix.target }} --
          -max_total_time=300 -rss_limit_mb=4096 -timeout=30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
