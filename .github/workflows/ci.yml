name: CI

# A change only to documentation (.md and .adoc files) runs nothing. Those under crates/ and
# tests/ are templates and fixtures the code builds in or reads, so a change there still runs.
# Patterns are read in order and the last match decides.
on:
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!**.adoc'
      - 'crates/**'
      - 'tests/**'
  push:
    branches: [main]
    paths:
      - '**'
      - '!**.md'
      - '!**.adoc'
      - 'crates/**'
      - 'tests/**'
  # A version tag runs CI through release.yml, which publishes only once it passes.
  workflow_call:

# A newer push to a pull request cancels the run it supersedes; runs on main and on tags always
# finish. Called from release.yml, the event is the tag's push, so the group is the tag's own.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # A CI build is never rebuilt in place, so incremental artefacts only cost time and cache.
  CARGO_INCREMENTAL: 0

# Every job's toolchain, components included, is rust-toolchain.toml's (`rustup toolchain
# install` with no name reads it). Every job has a time limit of about twice its longest recent
# run, so a hung test fails its job rather than holding a runner for GitHub's six hours.
jobs:
  lint:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - run: rustup toolchain install
      - name: Install GPUI system libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libfontconfig-dev libxcb1-dev libx11-xcb-dev libssl-dev
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
      - run: cargo xtask layers
      # The desktop entry and AppStream metadata the Linux packages and the Flatpak install, as
      # software centres and Flathub read them.
      - name: Linux desktop metadata
        run: |
          sudo apt-get install -y appstream desktop-file-utils
          appstreamcli validate --pedantic --no-net --explain packaging/linux/io.github.bovinemagnet.AdocFoundry.metainfo.xml
          desktop-file-validate packaging/linux/io.github.bovinemagnet.AdocFoundry.desktop
      # The release smoke test's signature checks, which otherwise run only on a signed release.
      - run: python3 -m unittest discover -s packaging -p 'test_*.py'

  test:
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # The workspace's tests, the app and adoc-ls with every feature fill more of the Ubuntu
      # runner's disk than it has free, and ld then dies of a bus error writing the last binary:
      # the toolsets it ships and this job never uses go first.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - run: rustup toolchain install
      # The dependencies' build output, keyed by OS, rustc and Cargo.lock. Only main saves it:
      # pull requests restore main's, so the three OS caches stay within the repository's 10 GB
      # and a pull request never evicts them.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install GPUI system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libfontconfig-dev libxcb1-dev libx11-xcb-dev libssl-dev
      # asciidoctor and asciidoctor-pdf are CI-only: the fidelity and PDF regression tests compare
      # against them and skip themselves without them. Nothing needs Ruby at runtime.
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        if: runner.os == 'Linux'
        with:
          ruby-version: '3.3'
      - name: Install asciidoctor and asciidoctor-pdf
        if: runner.os == 'Linux'
        run: gem install --no-document asciidoctor -v 2.0.26 && gem install --no-document asciidoctor-pdf -v 2.3.15
      # Every crate runs even when one fails, so a run reports every failure.
      - if: runner.os != 'Windows'
        run: cargo test --workspace --exclude adocfoundry --no-fail-fast
      # On Windows, `cargo test` has hung in a different test each time until the job's time
      # limit (#391). nextest stops a test after ten minutes and names it (`.config/nextest.toml`).
      # Installed after the cache is restored, so main's cache keeps it.
      - if: runner.os == 'Windows'
        run: cargo install cargo-nextest --version 0.9.151 --locked
      - if: runner.os == 'Windows'
        run: cargo nextest run --workspace --exclude adocfoundry --profile ci
      # The app's tests run on GPUI's test platform; on macOS it builds without a display server.
      - name: App tests
        if: runner.os == 'macOS'
        run: cargo test -p adocfoundry
      - run: cargo build -p adocfoundry
      # The language server alone, lean and with every feature; the default build must not
      # compile Typst or Git (checked by `cargo xtask layers`).
      - run: cargo build -p adoc-ls
      - run: cargo build -p adoc-ls --all-features
      - name: Disk space left
        if: always() && runner.os == 'Linux'
        run: df -h /

  bench:
    # The engine's benchmarks, on the engine thread, each held to its budget; the table goes in
    # the run's summary. Index memory is measured here only, from /proc.
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The app crate's grammar is a workspace member's dependency, so Cargo needs it to
        # resolve the workspace at all.
        with:
          persist-credentials: false
          submodules: recursive
      - run: rustup toolchain install
      - run: cargo bench -p adoc-engine --bench budgets

  typing:
    # The real app types into a 1 MB page for twenty seconds, through the editor widget and the
    # engine, and the frame intervals go in the run's summary. Recorded only: macOS draws no
    # frames for a window it cannot show, so a run with none says so rather than failing.
    timeout-minutes: 45
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - run: rustup toolchain install
      - run: cargo build --release -p adocfoundry
      - name: Type into a 1 MB page
        run: |
          page="$RUNNER_TEMP/typing/page.adoc"
          mkdir -p "$(dirname "$page")"
          python3 - "$page" <<'EOF'
          import sys
          lines, n = ["= A long page", ""], 0
          while sum(len(line) + 1 for line in lines) < 1_000_000:
              n += 1
              if n % 40 == 1:
                  lines += [f"== Section {n // 40 + 1}", ""]
              lines += [f"Paragraph {n} with *bold*, _emphasis_, `code` and xref:other.adoc[a link].", ""]
          open(sys.argv[1], "w").write("\n".join(lines))
          EOF
          # macOS has no `timeout`; the app quits itself once the benchmark ends.
          ADOCFOUNDRY_TYPING_BENCH=20 perl -e 'alarm shift; exec @ARGV' 300 \
            target/release/adocfoundry "$(dirname "$page")" "$page" 2> typing.log || tail -20 typing.log
          result=$(grep 'typing benchmark:' typing.log || echo 'typing benchmark: no result')
          echo "$result"
          printf '### Typing\n\nA character every 35 ms for 20 s into a 1 MB page: %s\n' \
            "${result#typing benchmark: }" >> "$GITHUB_STEP_SUMMARY"
          # Each frame over 25 ms, when it came and what the front end's thread did for it (#241).
          long=$(grep 'typing benchmark long frame:' typing.log | sed 's/^typing benchmark long frame: /- /')
          if [ -n "$long" ]; then
            echo "$long"
            printf '\nFrames over 25 ms:\n\n%s\n' "$long" >> "$GITHUB_STEP_SUMMARY"
          fi

  pdf-standards:
    # The reference article and the book fixture, validated by veraPDF as PDF/A-2a and PDF/UA-1,
    # and the article as PDF/A-1b and PDF/A-1a (the book's Mermaid diagram uses transparency,
    # which PDF/A-1 forbids).
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - run: rustup toolchain install
      - run: cargo build --release -p adocfoundry-cli
      - name: Export the reference PDFs
        run: |
          mkdir -p out
          cli=target/release/adocfoundry-cli
          $cli pdf tests/fixtures/pdf/reference/article.adoc --standard pdf-a-2a --output out/article-a.pdf
          $cli pdf tests/fixtures/pdf/reference/article.adoc --standard pdf-ua-1 --output out/article-ua.pdf
          $cli pdf tests/fixtures/pdf/reference/article.adoc --standard pdf-a-1b --output out/article-a1b.pdf
          $cli pdf tests/fixtures/pdf/reference/article.adoc --standard pdf-a-1a --output out/article-a1a.pdf
          cp -R tests/fixtures/pdf/book /tmp/book
          (cd /tmp/book && "$GITHUB_WORKSPACE/$cli" pdf guide --standard pdf-a-2a --standard pdf-ua-1 --output "$GITHUB_WORKSPACE/out/book.pdf")
      - name: Validate with veraPDF
        run: |
          verapdf() { docker run --rm -v "$PWD/out:/data" verapdf/cli:v1.30.3 --format text "$@"; }
          result=$( {
            verapdf --flavour 2a /data/article-a.pdf /data/book.pdf
            verapdf --flavour ua1 /data/article-ua.pdf /data/book.pdf
            verapdf --flavour 1b /data/article-a1b.pdf
            verapdf --flavour 1a /data/article-a1a.pdf
          } || true )
          echo "$result"
          if echo "$result" | grep -q '^FAIL'; then exit 1; fi
          test "$(echo "$result" | grep -c '^PASS')" -eq 6

  grammar:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - run: rustup toolchain install
      # A pinned version, its dependencies locked and checked against the registry's checksums.
      - run: cargo install tree-sitter-cli --version 0.27.1 --locked
      - name: Grammar corpus tests
        run: |
          for grammar in tree-sitter-asciidoc tree-sitter-asciidoc_inline; do
            (cd "grammars/tree-sitter-asciidoc/$grammar" && tree-sitter test)
          done
      - name: Queries compile against the grammars
        run: |
          sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libfontconfig-dev libxcb1-dev libx11-xcb-dev libssl-dev
          cargo test -p adocfoundry queries_compile

