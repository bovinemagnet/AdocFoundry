[package]
name = "adoc-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
adoc-antora.workspace = true
adoc-audit.workspace = true
adoc-impact.workspace = true
adoc-core.workspace = true
adoc-diagrams.workspace = true
adoc-dom.workspace = true
adoc-git = { workspace = true, optional = true }
adoc-graph.workspace = true
adoc-index.workspace = true
adoc-lang.workspace = true
adoc-model.workspace = true
adoc-parser.workspace = true
adoc-math = { workspace = true, optional = true }
adoc-pdf = { workspace = true, optional = true }
adoc-docx = { workspace = true, optional = true }
adoc-kindle = { workspace = true, optional = true }
# The book model Kindle and EPUB export share.
adoc-ebook = { workspace = true, optional = true }
adoc-epub = { workspace = true, optional = true }
adoc-docbook = { workspace = true, optional = true }
# Themes for PDF export and for a Word export's PDF-theme look; no Typst.
adoc-theme = { workspace = true, optional = true }
adoc-render.workspace = true
adoc-spell.workspace = true
dirs.workspace = true
notify.workspace = true
regex.workspace = true
ropey.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
similar.workspace = true
tempfile.workspace = true
toml.workspace = true
toml_edit.workspace = true

[features]
default = ["typst", "git", "docx", "kindle", "epub", "docbook"]
# PDF export and typeset STEM, through Typst.
typst = ["export", "dep:adoc-pdf", "dep:adoc-math"]
# DOCX export, with no Typst (docs/prd/PRD-AdocFoundry_DOCX_Export.md).
docx = ["export", "dep:adoc-docx"]
# Kindle export, AZW3 and KFX, with no Typst and no other exporter
# (docs/prd/PRD-AdocFoundry_Kindle_Export.md).
kindle = ["export", "dep:adoc-kindle", "dep:adoc-ebook"]
# EPUB export, EPUB 3.3, with no Typst and no other exporter
# (docs/prd/PRD-AdocFoundry_EPUB_Export.md).
epub = ["export", "dep:adoc-epub", "dep:adoc-ebook"]
# DocBook export, DocBook 5.2 XML with its pictures beside it, with no Typst, no other exporter
# and no diagram program started (docs/prd/PRD-AdocFoundry_DocBook_Export.md).
docbook = ["export", "dep:adoc-docbook"]
# The export pipeline the formats share; `typst`, `docx`, `kindle`, `epub` and `docbook` turn
# it on, and front ends name those, never this.
export = ["dep:adoc-theme"]
# Git state, changes and commits, through gix.
git = ["dep:adoc-git"]

[dev-dependencies]
adoc-core = { workspace = true, features = ["probe"] }
adoc-git = { workspace = true, features = ["test-support"] }
# Reading written DOCX packages back in `tests/docx_export.rs`.
adoc-docx = { workspace = true, features = ["test-support"] }
# Reading written Kindle books back in `tests/kindle_export.rs`.
adoc-kindle = { workspace = true, features = ["test-support"] }
# Reading written EPUB books back in `tests/epub_export.rs`.
adoc-epub = { workspace = true, features = ["test-support"] }
# Checking written DocBook against its schema in `tests/docbook_export.rs`.
adoc-docbook = { workspace = true, features = ["test-support"] }
flate2.workspace = true
insta.workspace = true
roxmltree.workspace = true

[[bench]]
name = "budgets"
harness = false

[lints]
workspace = true
