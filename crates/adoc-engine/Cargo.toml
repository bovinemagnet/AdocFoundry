[package]
name = "adoc-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
adoc-antora.workspace = true
adoc-audit.workspace = true
adoc-impact.workspace = true
adoc-core.workspace = true
adoc-diagrams.workspace = true
adoc-dom.workspace = true
adoc-git = { workspace = true, optional = true }
adoc-graph.workspace = true
adoc-index.workspace = true
adoc-lang.workspace = true
adoc-model.workspace = true
adoc-parser.workspace = true
adoc-math = { workspace = true, optional = true }
adoc-pdf = { workspace = true, optional = true }
adoc-render.workspace = true
adoc-spell.workspace = true
dirs.workspace = true
notify.workspace = true
regex.workspace = true
ropey.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
similar.workspace = true
tempfile.workspace = true
toml.workspace = true
toml_edit.workspace = true

[target.'cfg(unix)'.dependencies]
# Stopping a site build stops the processes npm started too, by their process group.
rustix.workspace = true

[features]
default = ["typst", "git"]
# PDF export and typeset STEM, through Typst.
typst = ["dep:adoc-pdf", "dep:adoc-math"]
# Git state, changes and commits, through gix.
git = ["dep:adoc-git"]

[dev-dependencies]
adoc-core = { workspace = true, features = ["probe"] }
adoc-git = { workspace = true, features = ["test-support"] }
insta.workspace = true

[[bench]]
name = "budgets"
harness = false

[lints]
workspace = true
