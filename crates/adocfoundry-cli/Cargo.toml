[package]
name = "adocfoundry-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
adoc-core.workspace = true
adoc-dom = { workspace = true, features = ["comparison"] }
adoc-engine = { workspace = true, features = ["typst", "git", "docx", "kindle", "epub", "docbook"] }
adoc-index.workspace = true
adoc-render.workspace = true
serde.workspace = true
serde_json.workspace = true
# `--no-cache`'s temporary diagram cache.
tempfile.workspace = true

# musl's own allocator made a 575-page PDF export 85% slower than glibc's (#811).
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc.workspace = true

[dev-dependencies]
# A Word template to export with, in `docx_look_choice_everywhere`.
adoc-docx = { workspace = true, features = ["test-support"] }
# Reading written EPUB books back in `epub_cli_exports_and_gates`.
adoc-epub = { workspace = true, features = ["test-support"] }
# Checking written DocBook against its schema in `docbook_cli_exports_and_gates`.
adoc-docbook = { workspace = true, features = ["test-support"] }
adoc-git = { workspace = true, features = ["test-support"] }
hayro.workspace = true
insta.workspace = true
tempfile.workspace = true

[lints]
workspace = true
