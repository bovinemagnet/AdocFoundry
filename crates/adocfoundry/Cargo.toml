[package]
name = "adocfoundry"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
adoc-core.workspace = true
adoc-engine = { workspace = true, features = ["typst", "git"] }
adoc-index.workspace = true
adoc-render.workspace = true
gpui.workspace = true
gpui-component.workspace = true
gpui-kit-assets.workspace = true
gpui-platform.workspace = true
image.workspace = true
# Only as the vocabulary of gpui-component's editor provider traits; see `editor/providers.rs`.
lsp-types.workspace = true
resvg.workspace = true
ropey.workspace = true
serde_json.workspace = true
tree-sitter-asciidoc.workspace = true
tree-sitter-asciidoc-inline.workspace = true

[build-dependencies]
embed-resource.workspace = true

[dev-dependencies]
adoc-git = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
gpui-component = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
tree-sitter.workspace = true

[lints]
workspace = true

[package.metadata.deb]
maintainer = "Paul Snow"
copyright = "2026, Paul Snow"
license-file = ["../../LICENSE", "0"]
extended-description = """\
A desktop editor for AsciiDoc documentation laid out the Antora way: navigation, \
cross-component link following, diagnostics, a native preview, visual editing, \
workspace search and page rename. \
Includes adocfoundry-cli, the adoc-ls language server and the adoc-mcp MCP server."""
section = "editors"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/adocfoundry", "usr/bin/", "755"],
    ["target/release/adocfoundry-cli", "usr/bin/", "755"],
    ["target/release/adoc-ls", "usr/bin/", "755"],
    ["target/release/adoc-mcp", "usr/bin/", "755"],
    ["../../packaging/linux/io.github.bovinemagnet.AdocFoundry.desktop", "usr/share/applications/", "644"],
    ["../../packaging/icons/adocfoundry-256.png", "usr/share/icons/hicolor/256x256/apps/io.github.bovinemagnet.AdocFoundry.png", "644"],
]

[package.metadata.generate-rpm]
summary = "Desktop editor for AsciiDoc documentation laid out the Antora way"
assets = [
    { source = "target/release/adocfoundry", dest = "/usr/bin/adocfoundry", mode = "755" },
    { source = "target/release/adocfoundry-cli", dest = "/usr/bin/adocfoundry-cli", mode = "755" },
    { source = "target/release/adoc-ls", dest = "/usr/bin/adoc-ls", mode = "755" },
    { source = "target/release/adoc-mcp", dest = "/usr/bin/adoc-mcp", mode = "755" },
    { source = "packaging/linux/io.github.bovinemagnet.AdocFoundry.desktop", dest = "/usr/share/applications/io.github.bovinemagnet.AdocFoundry.desktop", mode = "644" },
    { source = "packaging/icons/adocfoundry-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/io.github.bovinemagnet.AdocFoundry.png", mode = "644" },
]
