[package]
name = "adoc-docx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
adoc-core.workspace = true
adoc-dom.workspace = true
adoc-render.workspace = true
adoc-theme.workspace = true
crc32fast.workspace = true
flate2.workspace = true
resvg.workspace = true
# `testing`, for tests here and in the engine.
roxmltree = { workspace = true, optional = true }

[features]
# The package reader and validator in `testing`, for tests that read what was written.
test-support = ["dep:roxmltree"]

[dev-dependencies]
adoc-docx = { path = ".", features = ["test-support"] }
roxmltree.workspace = true
tempfile.workspace = true

[lints]
workspace = true
