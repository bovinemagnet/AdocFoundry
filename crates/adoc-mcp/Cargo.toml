[package]
name = "adoc-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
adoc-core.workspace = true
adoc-engine = { workspace = true, features = ["typst", "git", "docx", "kindle", "epub", "docbook"] }
bytes.workspace = true
getrandom.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[dev-dependencies]
# A Word template to export with, in `docx_look_choice_everywhere`.
adoc-docx = { workspace = true, features = ["test-support"] }
# An EPUB read back and checked whole, in `epub_mcp_export_is_write_gated`.
adoc-epub = { workspace = true, features = ["test-support"] }
# A DocBook document checked against its schema, in `docbook_mcp_export_is_write_gated`.
adoc-docbook = { workspace = true, features = ["test-support"] }
adoc-git = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
