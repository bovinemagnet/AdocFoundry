# cargo-deny policy. Licences: permissive only; GPL and LGPL are denied.
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Unmaintained notices for transitive crates (mostly the GPUI tree) are reported upstream;
# only workspace crates' direct dependencies fail the check.
unmaintained = "workspace"
# quick-xml 0.38 is reached only through typst-library -> hayagriva -> citationberg, which parses
# CSL styles for Typst's `bibliography()`. adoc-pdf's generated Typst never calls it, and
# citationberg 0.7.0, the latest, still needs quick-xml 0.38. Remove when citationberg moves on.
ignore = [
    { id = "RUSTSEC-2026-0194", reason = "quick-xml via citationberg; Typst bibliographies are never used" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml via citationberg; Typst bibliographies are never used" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MPL-2.0",
    "Unlicense",
    "Zlib",
    "OFL-1.1",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "allow"
deny = [
    # Zed's GPL-3.0 editor crates must never enter the tree.
    { name = "editor" },
    { name = "text" },
    { name = "rope" },
    { name = "multi_buffer" },
    { name = "language" },
    { name = "project" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
