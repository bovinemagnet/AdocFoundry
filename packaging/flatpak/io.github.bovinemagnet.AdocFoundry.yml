# Flatpak manifest for AdocFoundry.
#
# Build offline-capable sources first with flatpak-cargo-generator (flatpak/flatpak-builder-tools):
#   python3 flatpak-cargo-generator.py ../../Cargo.lock -o cargo-sources.json
# then: flatpak-builder --user --install build io.github.bovinemagnet.AdocFoundry.yml
# The source is the release's tag, which `cargo xtask bump` writes; the release workflow's
# `flatpak` job builds the tagged commit's own checkout instead.
app-id: io.github.bovinemagnet.AdocFoundry
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: adocfoundry
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=home
build-options:
  append-path: /app/rust/bin
  env:
    CARGO_HOME: /run/build/adocfoundry/cargo
    # The sandbox has no network: every cargo command, `cargo metadata` inside
    # `xtask notices` too, reads only the vendored sources.
    CARGO_NET_OFFLINE: 'true'
modules:
  # rust-toolchain.toml's release, the compiler every other build uses, from the Rust project's
  # own archives, checked against their SHA-256: the runtime's rust-stable extension lags it.
  # Built into /app/rust and removed from the app once it is built. A new toolchain needs both
  # URLs and checksums from https://static.rust-lang.org/dist/ (checked by
  # packaging/test_toolchain.py).
  - name: rust
    buildsystem: simple
    build-commands:
      - ./install.sh --prefix=/app/rust --disable-ldconfig --components=rustc,cargo,rust-std-${FLATPAK_ARCH}-unknown-linux-gnu
    cleanup:
      - /rust
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://static.rust-lang.org/dist/rust-1.99.1-x86_64-unknown-linux-gnu.tar.xz
        sha256: 231fcae47ee950621374725b5fc3b5441d2fbda2955ac45dd7dc816d8876cfe7
      - type: archive
        only-arches: [aarch64]
        url: https://static.rust-lang.org/dist/rust-1.99.1-aarch64-unknown-linux-gnu.tar.xz
        sha256: a48fb1e853be56ce9b8e2751f5464dbd5e16440cd81e237920f3a5e7e806333e
  - name: adocfoundry
    buildsystem: simple
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release -p adocfoundry -p adocfoundry-cli -p adoc-ls -p adoc-mcp --features adoc-ls/typst,adoc-ls/git
      - install -Dm755 target/release/adocfoundry -t /app/bin
      - install -Dm755 target/release/adocfoundry-cli -t /app/bin
      - install -Dm755 target/release/adoc-ls -t /app/bin
      - install -Dm755 target/release/adoc-mcp -t /app/bin
      - install -Dm644 packaging/linux/io.github.bovinemagnet.AdocFoundry.desktop -t /app/share/applications
      - install -Dm644 packaging/linux/io.github.bovinemagnet.AdocFoundry.metainfo.xml -t /app/share/metainfo
      - install -Dm644 packaging/icons/adocfoundry-256.png /app/share/icons/hicolor/256x256/apps/io.github.bovinemagnet.AdocFoundry.png
      - install -Dm644 crates/adoc-spell/dictionaries/README.md /app/share/doc/adocfoundry/SCOWL.txt
      - cargo --offline xtask notices target/THIRD-PARTY-NOTICES.txt
      - install -Dm644 target/THIRD-PARTY-NOTICES.txt -t /app/share/doc/adocfoundry
    sources:
      - type: git
        url: https://github.com/bovinemagnet/AdocFoundry.git
        tag: v0.8.0
      - cargo-sources.json
