[workspace]
members = ["crates/*", "xtask"]
# The grammar submodule carries its own binding crates, used as path dependencies.
exclude = ["grammars", "vendor"]
default-members = ["crates/adocfoundry"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/bovinemagnet/AdocFoundry"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
# Internal crates
adoc-antora = { path = "crates/adoc-antora" }
adoc-core = { path = "crates/adoc-core" }
adoc-diagrams = { path = "crates/adoc-diagrams" }
adoc-dom = { path = "crates/adoc-dom" }
# Front ends choose its features: `typst` (PDF export, typeset STEM) and `git`.
adoc-engine = { path = "crates/adoc-engine", default-features = false }
adoc-git = { path = "crates/adoc-git" }
adoc-index = { path = "crates/adoc-index" }
adoc-mcp = { path = "crates/adoc-mcp" }
adoc-lang = { path = "crates/adoc-lang" }
adoc-math = { path = "crates/adoc-math" }
adoc-model = { path = "crates/adoc-model" }
adoc-parser = { path = "crates/adoc-parser" }
adoc-pdf = { path = "crates/adoc-pdf" }
adoc-spell = { path = "crates/adoc-spell" }
adoc-render = { path = "crates/adoc-render" }

# External crates: every entry pinned exactly; crates reference these, never their own versions
acdc-parser = "=0.11.0"
asciidoc-parser = "=0.31.2"
base64 = "=0.22.1"
dirs = "=6.0.0"
# Embeds the app's Windows icon; already in the tree through GPUI.
embed-resource = "=3.0.12"
# Pure-Rust Git, without network transports; see crates/adoc-git.
globset = "=0.4.20"
gix = { version = "=0.90.0", default-features = false, features = ["sha1", "status", "revision", "blame"] }
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui-component = { version = "=0.8.0", features = [
    "tree-sitter",
    "tree-sitter-bash",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-sql",
    "tree-sitter-toml",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
gpui-kit-assets = "=0.8.0"
# The app's image viewer: the decoders and SVG renderer GPUI already uses, at its versions.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
resvg = { version = "=0.46.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
# Rasterises PDFs for the visual regression tests; already in the tree through Typst.
hayro = "=0.7.1"
hayro-syntax = "=0.7.2"
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
# Built from the grammar submodule by the grammar's own binding crates.
tree-sitter-asciidoc = { path = "grammars/tree-sitter-asciidoc/tree-sitter-asciidoc" }
tree-sitter-asciidoc-inline = { path = "grammars/tree-sitter-asciidoc/tree-sitter-asciidoc_inline" }
insta = { version = "=1.49.0", features = ["json"] }
lsp-server = "=0.10.0"
# The channel lsp-server hands messages over, for waiting with a timeout.
crossbeam-channel = "=0.5.16"
# `proposed` is enabled by gpui-component through feature unification; enable it everywhere
# so adoc-ls compiles the same way alone and in the workspace.
merman = { version = "=0.9.2", default-features = false, features = ["all-diagrams", "complete-svg"] }
lsp-types = { version = "=0.97.0", features = ["proposed"] }
notify = "=8.2.0"
regex = "=1.13.1"
ropey = "=2.0.0-beta.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde-saphyr = { version = "=1.3.0", default-features = false, features = ["deserialize"] }
serde_json = "=1.0.154"
# The MCP server: its server side, over stdio and Streamable HTTP; see crates/adoc-mcp.
rmcp = { version = "=3.7.0", default-features = false, features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
# The MCP server's HTTP listener: hyper's server side only, never its client (checked by
# `cargo xtask layers`). All already in the tree.
hyper = { version = "=1.12.0", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["server", "http1", "tokio"] }
http = "=1.5.0"
http-body-util = "=0.1.5"
bytes = "=1.12.1"
tokio-util = { version = "=0.7.20", default-features = false }
# The MCP server's generated HTTP token.
getrandom = "=0.3.4"
schemars = "=1.2.3"
tokio = { version = "=1.54.1", features = ["rt", "macros", "io-std", "time", "net", "signal"] }
sha2 = "=0.10.9"
# Line diffs for crash recovery and local history; already in the tree through insta.
similar = { version = "=2.7.0", default-features = false, features = ["text"] }
spellbook = "=0.4.2"
tempfile = "=3.27.0"
toml = "=1.1.8"
tree-sitter = "=0.26.13"
# PDF export: Typst as a library, without its bundled fonts or packages; see crates/adoc-pdf.
asciimath-parser = "=0.5.0"
mitex = "=0.2.4"
typst = "=0.15.1"
typst-library = "=0.15.1"
typst-syntax = "=0.15.1"
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
typst-svg = "=0.15.1"
unicode-segmentation = "=1.13.3"
url = "=2.5.8"

[patch.crates-io]
# acdc-parser depends on evalexpr 13, which is AGPL-3.0-only; see vendor/README.md.
evalexpr = { path = "vendor/evalexpr" }
# comemo keeps the memory of the caches it evicts, gigabytes after a book; see vendor/README.md.
comemo = { path = "vendor/comemo" }

