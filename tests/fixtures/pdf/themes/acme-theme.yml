# A theme written for asciidoctor-pdf 2.3, used unchanged by AdocFoundry's tests.
extends:
- default
- ./acme-base-theme.yml
font:
  catalog:
    merge: true
    Acme Mono:
      normal: fonts/acme-mono.ttf
      bold: fonts/acme-mono.ttf
      italic: fonts/acme-mono.ttf
      bold_italic: fonts/acme-mono.ttf
    Acme Serif: GEM_FONTS_DIR/notoserif-regular-subset.ttf
  fallbacks:
  - Noto Serif
page:
  size: Letter
  margin: [0.75in, 1in, 20mm, 2.5cm]
  background-color: transparent
base:
  font-size: 11
  line-height-length: 14
  line-height: $base-line-height-length / $base-font-size
  font-size-large: round($base-font-size * 1.3)
  font-size-small: floor($base_font_size * 0.8)
role:
  red:
    font-color: FF0000
  big-blue:
    font-color: [100%, 50%, 0, 0]
heading:
  font-color: $brand-primary
  h2-font-size: ceil($base_font_size * 1.9)
  h3-font-size: $base_font_size * 1.5 + 2
  margin-top: 6pt * 2
  margin-bottom: -$base_font_size / 2
blockquote:
  font-style: italic
title-page:
  align: left
  logo:
    image: image:images/logo.svg[width=40%]
    top: 5%
  title:
    top: 40%
    font-color: 000
codespan:
  font-family: Acme Mono
  font-color: ~
code:
  font-family: $codespan_font_family
  font-size: 0.5in / 4
  border-radius: 2 ^ 2
link:
  font-color: $brand_primary
header:
  height: 0.5in
  recto:
    center:
      content: '{document-title}'
  verso:
    center:
      content: $header_recto_center_content
footer:
  recto:
    right:
      content: '{section-or-chapter-title} | *{page-number}*'
  verso:
    left:
      content: '*{page-number}* | {chapter-title}'
mystery:
  key: 1
