// Builds the Antora documentation site in src/docs: `gradle25w antora` (or ./gradlew antora).
// The application itself is a Cargo workspace; nothing here is needed to build or run it.
// Every input is pinned, so the site builds the same here and in .github/workflows/docs.yml.
plugins {
    id 'org.antora' version '1.0.0'
}

antora {
    version = '3.2.2'
    playbook = file('antora-playbook.yml')
    options = [clean: true, fetch: true, stacktrace: true]
    packages = [
        '@antora/lunr-extension': '1.0.0-alpha.13',
        '@sntke/antora-mermaid-extension': '0.0.13'
    ]
}

// The plugin downloads Node.js itself; without a version it takes the latest LTS release.
node {
    version = '26.13.1'
}
