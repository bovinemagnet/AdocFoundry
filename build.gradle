// Builds the Antora documentation site in src/docs: `gradle25w antora` (or ./gradlew antora).
// The application itself is a Cargo workspace; nothing here is needed to build or run it.
plugins {
    id 'org.antora' version '1.0.0'
}

antora {
    playbook = file('antora-playbook.yml')
    options = [clean: true, fetch: true, stacktrace: true]
    packages = [
        '@antora/lunr-extension': 'latest',
        '@sntke/antora-mermaid-extension': 'latest'
    ]
}
