antora:
  extensions:
    - require: "@antora/lunr-extension"
      index_latest_only: true
    - require: "@sntke/antora-mermaid-extension"
      mermaid_library_url: https://cdn.jsdelivr.net/npm/mermaid@10.9.8/dist/mermaid.esm.min.mjs
      script_stem: header-scripts
      mermaid_initialize_options:
        start_on_load: true
runtime:
  cache_dir: ./.cache/antora
  log:
    failure_level: warn
site:
  title: AdocFoundry Documentation
  url: https://bovinemagnet.github.io/AdocFoundry
  start_page: adocfoundry::index.adoc
  keys:
    tagline: A native desktop editor for AsciiDoc and Antora documentation.
    repo_url: https://github.com/bovinemagnet/AdocFoundry

content:
  sources:
    - url: .
      start_path: src/docs
      branches: HEAD

ui:
  bundle:
    # A release asset never changes, so it is not a snapshot.
    url: https://github.com/bovinemagnet/snowed-under-antora-ui-bundle/releases/download/v0.2.0/ui-bundle.zip
  # The app's icon in the header and as the favicon: partials copied from the bundle's release
  # above, with the icon added (checked by packaging/test_workflows.py).
  supplemental_files: ./src/docs/supplemental-ui

asciidoc:
  attributes:
    project-name: AdocFoundry
    source-highlighter: highlight.js
    icons: font
    sectanchors: ""
    sectlinks: ""
    experimental: ""

output:
  dir: ./build/site
